name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android
        env:
          CAPACITOR_TELEMETRY: "0"
          CI: "true"
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json || true
          npx --yes @capacitor/cli sync android || true

      - name: Make gradlew executable
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy APK to root
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ./app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: "Only us APK • Release v1.0.0"
          body: |
            ### 🌸 Only us (Ishant AI) • Android APK
            
            This is the official Android APK for **Only us** featuring Ishant AI.
            
            - **Filename:** `app-debug.apk`
            - **Platform:** Android
            
            #### 📲 Installation:
            1. Download `app-debug.apk` on your Android device.
            2. Tap on the file in your downloads to install.
            3. If prompted by your device, allow "Install from Unknown Sources".
          files: ./app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
