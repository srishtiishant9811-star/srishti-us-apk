name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android
        env:
          CAPACITOR_TELEMETRY: "0"
          CI: "true"
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json || true
          npx --yes @capacitor/cli sync android || true

      - name: Make gradlew executable
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          if ! ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_output.log; then
            echo "==================== BUILD FAILED - RECENT LOGS ===================="
            tail -n 80 /tmp/gradle_output.log
            exit 1
          fi

      - name: Copy APK to root
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ./app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle_output.log
          if-no-files-found: ignore

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: "Only us APK • Release v1.0.0"
          body: |
            ### 🌸 Only us (Ishant AI) • Android APK
            
            This is the official Android APK for **Only us** featuring Ishant AI.
            
            - **Filename:** `app-debug.apk`
            - **Platform:** Android
            
            #### 📲 Installation:
            1. Download `app-debug.apk` on your Android device.
            2. Tap on the file in your downloads to install.
            3. If prompted by your device, allow "Install from Unknown Sources".
          files: ./app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
